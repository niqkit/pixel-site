<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Scratch для малышей">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="catbody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Звёздочки и блёстки -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="90" cy="80" r="7"/>
    <circle cx="680" cy="90" r="5"/>
    <circle cx="560" cy="60" r="9"/>
    <circle cx="250" cy="55" r="4"/>
    <circle cx="740" cy="300" r="6"/>
    <circle cx="70" cy="340" r="5"/>
    <circle cx="170" cy="150" r="6"/>
    <circle cx="640" cy="420" r="7"/>
  </g>

  <!-- Облако -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="620" cy="180" rx="70" ry="30"/>
    <ellipse cx="580" cy="165" rx="40" ry="24"/>
    <ellipse cx="665" cy="168" rx="36" ry="20"/>
  </g>

  <!-- Кубики-блоки Scratch -->
  <g>
    <rect x="80" y="350" width="70" height="70" rx="12" fill="#4ade80"/>
    <rect x="110" y="330" width="70" height="70" rx="12" fill="#fb7185"/>
    <rect x="150" y="300" width="70" height="70" rx="12" fill="#facc15"/>
    <rect x="200" y="275" width="70" height="70" rx="12" fill="#60a5fa"/>
  </g>

  <!-- Кот Scratch -->
  <g transform="translate(360,140)">
    <!-- Хвост -->
    <path d="M-40,180 Q-110,160 -90,80" fill="none" stroke="url(#catbody)" stroke-width="26" stroke-linecap="round"/>
    <!-- Туловище -->
    <ellipse cx="0" cy="150" rx="78" ry="62" fill="url(#catbody)"/>
    <!-- Пузико -->
    <ellipse cx="0" cy="165" rx="48" ry="40" fill="#fff7ed"/>
    <!-- Уши -->
    <polygon points="-55,-35 -70,-110 -15,-65" fill="url(#catbody)"/>
    <polygon points="-48,-48 -62,-92 -28,-63" fill="#fda4af"/>
    <polygon points="55,-35 70,-110 15,-65" fill="url(#catbody)"/>
    <polygon points="48,-48 62,-92 28,-63" fill="#fda4af"/>
    <!-- Голова -->
    <circle cx="0" cy="-15" r="70" fill="url(#catbody)"/>
    <!-- Мордочка -->
    <circle cx="-24" cy="-18" r="10" fill="#ffffff"/>
    <circle cx="24" cy="-18" r="10" fill="#ffffff"/>
    <circle cx="-22" cy="-16" r="5" fill="#1e293b"/>
    <circle cx="22" cy="-16" r="5" fill="#1e293b"/>
    <polygon points="0,2 -10,20 10,20" fill="#fda4af"/>
    <path d="M-14,22 Q-8,32 0,28" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <path d="M14,22 Q8,32 0,28" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="-45" x2="-52" y2="-30" stroke="#ffedd5" stroke-width="7" stroke-linecap="round"/>
    <line x1="40" y1="-45" x2="52" y2="-30" stroke="#ffedd5" stroke-width="7" stroke-linecap="round"/>
    <!-- Лапы -->
    <ellipse cx="-55" cy="205" rx="26" ry="18" fill="url(#catbody)"/>
    <ellipse cx="55" cy="205" rx="26" ry="18" fill="url(#catbody)"/>
  </g>

  <!-- Текст на картинке -->
  <text x="400" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1e293b" letter-spacing="1">Scratch · Логика через игру</text>
</svg>