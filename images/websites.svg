<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Создание сайтов">
  <defs>
    <linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#fdf4ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgw)"/>

  <!-- Кружки-палитра как в Figma -->
  <g>
    <circle cx="110" cy="95" r="36" fill="#f472b6"/>
    <circle cx="166" cy="95" r="36" fill="#fbbf24"/>
    <circle cx="54" cy="95" r="36" fill="#a78bfa"/>
    <circle cx="110" cy="50" r="36" fill="#34d399"/>
    <circle cx="166" cy="50" r="36" fill="#60a5fa"/>
  </g>

  <!-- Плавающий значок кода и подпись -->
  <g transform="translate(590,60)">
    <g stroke="#2563eb" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M30,15 L8,42 L30,69"/>
      <path d="M54,15 L76,42 L54,69"/>
      <path d="M22,78 L58,6"/>
    </g>
    <text x="8" y="110" font-family="monospace" font-size="20" fill="#6366f1" opacity="0.75">HTML · CSS · JS</text>
  </g>

  <!-- Окно браузера с мини-сайтом -->
  <g transform="translate(130,150)">
    <!-- тень окна -->
    <rect width="540" height="330" rx="20" fill="#a5b4fc" opacity="0.35" transform="translate(8,8)"/>
    <!-- окно -->
    <rect width="540" height="330" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/>
    <!-- панель вкладки -->
    <path d="M0,20 Q0,0 20,0 L520,0 Q540,0 540,20 L540,60 L0,60 Z" fill="#e0e7ff"/>
    <!-- кнопки окна -->
    <circle cx="36" cy="30" r="9" fill="#f87171"/>
    <circle cx="64" cy="30" r="9" fill="#fbbf24"/>
    <circle cx="92" cy="30" r="9" fill="#34d399"/>
    <!-- адресная строка -->
    <rect x="130" y="20" width="300" height="20" rx="10" fill="#f1f5f9"/>
    <text x="145" y="34" font-family="monospace" font-size="12" fill="#64748b">pixel-school.ru</text>

    <!-- мини-сайт внутри окна -->
    <!-- навигация -->
    <circle cx="40" cy="105" r="10" fill="#2563eb"/>
    <rect x="330" y="98" width="60" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="405" y="98" width="60" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="480" y="98" width="40" height="14" rx="7" fill="#fbbf24"/>
    <!-- заголовок -->
    <rect x="30" y="155" width="240" height="26" rx="8" fill="#1e293b"/>
    <rect x="30" y="195" width="200" height="14" rx="7" fill="#94a3b8"/>
    <rect x="30" y="218" width="230" height="14" rx="7" fill="#94a3b8"/>
    <!-- кнопки -->
    <rect x="30" y="255" width="110" height="30" rx="8" fill="#2563eb"/>
    <rect x="155" y="255" width="110" height="30" rx="8" fill="#e2e8f0"/>
    <!-- карточки -->
    <rect x="330" y="150" width="90" height="70" rx="10" fill="#dbeafe"/>
    <rect x="435" y="150" width="90" height="70" rx="10" fill="#fef3c7"/>
    <rect x="330" y="235" width="90" height="60" rx="10" fill="#dcfce7"/>
    <rect x="435" y="235" width="90" height="60" rx="10" fill="#fce7f3"/>
  </g>
</svg>
