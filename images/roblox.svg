<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Разработка игр в Roblox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Пол: сетка в перспективе -->
  <g stroke="#a5b4fc" stroke-width="2" opacity="0.15">
    <line x1="0" y1="395" x2="800" y2="395"/>
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="0" y1="465" x2="800" y2="465"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="250" y1="395" x2="160" y2="500"/>
    <line x1="400" y1="395" x2="400" y2="500"/>
    <line x1="550" y1="395" x2="640" y2="500"/>
  </g>

  <!-- Парящие блоки-кирпичи -->
  <g stroke="#ffffff" stroke-width="4">
    <rect x="80" y="90" width="90" height="90" rx="14" fill="#34d399" transform="rotate(-8 125 135)"/>
    <rect x="630" y="70" width="90" height="90" rx="14" fill="#a78bfa" transform="rotate(10 675 115)"/>
    <rect x="660" y="300" width="80" height="80" rx="14" fill="#fbbf24" transform="rotate(-12 700 340)"/>
    <rect x="70" y="290" width="80" height="80" rx="14" fill="#60a5fa" transform="rotate(9 110 330)"/>
  </g>

  <!-- Тень под персонажем -->
  <ellipse cx="400" cy="430" rx="155" ry="20" fill="#0f0b2e" opacity="0.35"/>

  <!-- Блочный персонаж из кубиков -->
  <g transform="translate(400,235)">
    <!-- Ноги -->
    <rect x="-55" y="130" width="45" height="45" rx="10" fill="#facc15" stroke="#ffffff" stroke-width="5"/>
    <rect x="10" y="130" width="45" height="45" rx="10" fill="#facc15" stroke="#ffffff" stroke-width="5"/>
    <!-- Тело -->
    <rect x="-70" y="30" width="140" height="110" rx="16" fill="url(#body)" stroke="#ffffff" stroke-width="5"/>
    <!-- Голова -->
    <rect x="-65" y="-100" width="130" height="140" rx="18" fill="#facc15" stroke="#ffffff" stroke-width="5"/>
    <!-- Глаза -->
    <rect x="-42" y="-60" width="20" height="30" rx="6" fill="#1e293b"/>
    <rect x="22" y="-60" width="20" height="30" rx="6" fill="#1e293b"/>
    <!-- Улыбка -->
    <rect x="-24" y="-2" width="48" height="12" rx="6" fill="#1e293b"/>
  </g>

  <!-- Код Lua на фоне -->
  <g font-family="monospace" font-size="22" fill="#a5b4fc" opacity="0.8">
    <text x="70" y="230">game.Players.LocalPlayer</text>
    <text x="70" y="260">print("Hello, Roblox!")</text>
    <text x="640" y="230">local x = 10</text>
    <text x="640" y="260">wait(2)</text>
  </g>
</svg>
